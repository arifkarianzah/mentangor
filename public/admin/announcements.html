<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kegiatan - Posyandu RW 02 Mentangor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../assets/css/style.css?v=4">
    <link rel="stylesheet" href="../assets/css/admin.css?v=10">
</head>
<body class="admin-body">

    <div class="wrapper">
        <!-- Sidebar -->
                <!-- Sidebar (loaded dynamically) -->
        <div id="sidebar-container"></div>

        <!-- Page Content -->
        <div id="content">
            <!-- Navbar (loaded dynamically) -->
            <div id="navbar-container"></div>

            <div class="main-content">
                <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
                    <div>
                        <h3 class="fw-medium text-dark mb-1">Kelola Kegiatan</h3>
                        <p class="text-muted mb-0">Publikasi informasi terbaru untuk warga desa.</p>
                    </div>
                    
                    <button class="btn btn-primary-green d-none admin-only" onclick="showFormModal()">
                        <i class="fa-solid fa-plus me-2"></i> Tambah Pengumuman
                    </button>
                </div>

                <div class="admin-card p-0">
                    <div class="table-responsive p-3">
                        <table class="table table-custom align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3" style="width: 70px;">Foto</th>
                                    <th>Judul Pengumuman</th>
                                    <th>Kategori</th>
                                    <th>Status</th>
                                    <th>Tgl. Publikasi</th>
                                    <th class="text-end pe-3 admin-only d-none">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary-green"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-3 px-2">
                    <span class="text-muted small" id="pageInfo">Menampilkan 0 data</span>
                    <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
                </div>
            <!-- Modal Form -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-medium" id="modalTitle">Tambah Pengumuman</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <form id="announcementForm">
                        <input type="hidden" id="inputId">
                        
                        <div class="mb-3">
                            <label class="form-label fw-medium">Judul Pengumuman <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="inputTitle" required placeholder="Contoh: Jadwal Posyandu Balita Bulan Depan">
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Kategori</label>
                                <select class="form-select" id="inputType">
                                    <option value="umum">Umum</option>
                                    <option value="kegiatan">Kegiatan Desa</option>
                                    <option value="gotong_royong">Gotong Royong</option>
                                    <option value="posyandu">Posyandu</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-medium">Tanggal Publikasi</label>
                                <input type="date" class="form-control" id="inputDate" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium">Isi Pengumuman <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="inputContent" rows="5" required placeholder="Tulis rincian pengumuman di sini..."></textarea>
                        </div>

                        <!-- Upload Foto Pengumuman -->
                        <div class="mb-3">
                            <label class="form-label fw-medium">Foto / Gambar Pengumuman</label>
                            <div class="p-3 border rounded-3 bg-light">
                                <div class="d-flex align-items-center gap-3 flex-wrap">
                                    <div id="imagePreviewWrapper" class="position-relative d-none" style="width: 100px; height: 100px;">
                                        <img id="imagePreview" src="" alt="Preview" class="w-100 h-100 object-fit-cover rounded-3 border shadow-sm">
                                        <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 rounded-circle m-1" style="width: 24px; height: 24px; padding: 0; line-height: 1;" onclick="clearSelectedImage()" title="Hapus foto"><i class="fa-solid fa-times"></i></button>
                                    </div>
                                    <div class="flex-grow-1">
                                        <input type="file" class="form-control" id="inputImage" accept="image/jpeg,image/png,image/webp,image/jpg">
                                        <div class="form-text small text-muted mt-1">
                                            <i class="fa-regular fa-image me-1"></i> Format: JPG, PNG, atau WEBP (Maksimal 5MB). Foto akan tampil di halaman depan dan detail pengumuman.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="inputPin">
                            <label class="form-check-label fw-medium" for="inputPin">Sematkan (Pin di posisi teratas)</label>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-primary-green rounded-pill px-4" id="btnSubmitForm">Simpan</button>
                        </div></form>
                </div>
            </div>
        </div>
    </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js?v=12"></script>
    <script src="../assets/js/dashboard.js"></script>
    
    <script>
        window.currentPage = 1;
        window.formModal = null;
        window.isAdmin = false;
        window.selectedImageFile = null;

        window.initPage = async (isSPA = false) => {
            if (!Auth.isAuthenticated()) { window.location.href = 'login.html'; return; }
            if (!isSPA) await Components.load('announcements');
            const user = Auth.getUser();
            if (user && user.role === 'admin') {
                window.isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('d-none'));
            }

            window.formModal = new bootstrap.Modal(document.getElementById('formModal'));
            window.fetchData();

            const form = document.getElementById('announcementForm');
            if (form) {
                form.removeEventListener('submit', window.handleFormSubmit);
                form.addEventListener('submit', window.handleFormSubmit);
            }

            // Preview image handler
            const inputImage = document.getElementById('inputImage');
            if (inputImage) {
                inputImage.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                if (!['image/jpeg', 'image/png', 'image/webp', 'image/jpg'].includes(file.type)) {
                    Swal.fire('Format Salah', 'Harap pilih file gambar JPG, PNG, atau WEBP.', 'error');
                    this.value = '';
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    Swal.fire('Ukuran Terlalu Besar', 'Ukuran foto maksimal 5MB.', 'error');
                    this.value = '';
                    return;
                }

                window.selectedImageFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('imagePreview').src = event.target.result;
                    document.getElementById('imagePreviewWrapper').classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            });
            }
        };

        window.clearSelectedImage = function() {
            document.getElementById('inputImage').value = '';
            window.selectedImageFile = null;
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreviewWrapper').classList.add('d-none');
        }

        window.fetchData = async function() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary-green"></div></td></tr>`;
            
            try {
                const res = await API.get(`/announcements/admin/list?page=${window.currentPage}&limit=10`);
                if (res.success) {
                    window.renderTable(res.data);
                    window.renderPagination(res.pagination);
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">Gagal memuat data</td></tr>`;
            }
        }

        window.renderTable = function(data) {
            const tbody = document.getElementById('tableBody');
            const apiBase = API_URL.replace('/api', '');
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">Tidak ada pengumuman</td></tr>`;
                return;
            }
            
            tbody.innerHTML = data.map(item => {
                const date = new Date(item.published_at).toLocaleDateString('id-ID', {
                    day: 'numeric', month: 'short', year: 'numeric'
                });
                
                let typeBadge = 'bg-primary';
                let typeName = item.type;
                if(item.type === 'kegiatan') { typeBadge = 'bg-info'; typeName = 'Kegiatan'; }
                else if(item.type === 'gotong_royong') { typeBadge = 'bg-success'; typeName = 'Gotong Royong'; }
                else if(item.type === 'posyandu') { typeBadge = 'bg-warning text-dark'; typeName = 'Posyandu'; }
                else { typeName = 'Umum'; }
                
                const pinIcon = item.is_pinned ? '<i class="fa-solid fa-thumbtack text-danger ms-1" title="Disematkan (Pin)"></i>' : '';
                
                const statusBadge = item.is_active 
                    ? '<span class="badge bg-success">Aktif</span>' 
                    : '<span class="badge bg-secondary">Nonaktif</span>';

                const thumb = item.image 
                    ? `<img src="${apiBase}/uploads/${item.image}" class="rounded-3 object-fit-cover shadow-sm border" style="width: 48px; height: 48px;" alt="Foto">` 
                    : `<div class="bg-light rounded-3 d-flex align-items-center justify-content-center border text-muted shadow-sm" style="width: 48px; height: 48px;"><i class="fa-regular fa-image"></i></div>`;

                let actionBtns = '';
                if (window.isAdmin) {
                    actionBtns = `
                        <td class="text-end pe-3 admin-only">
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-primary" onclick="window.editItem(${item.id})" title="Edit Pengumuman & Foto"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="window.togglePin(${item.id})" title="Toggle Pin"><i class="fa-solid fa-thumbtack"></i></button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="window.toggleActive(${item.id})" title="Toggle Aktif/Nonaktif"><i class="fa-solid fa-power-off"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="window.deleteItem(${item.id})" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    `;
                }

                return `
                    <tr>
                        <td class="ps-3">${thumb}</td>
                        <td class="fw-medium">
                            <div class="text-dark">${item.title} ${pinIcon}</div>
                            <small class="text-muted text-truncate d-inline-block" style="max-width: 250px;">${item.content ? item.content.substring(0, 50) + '...' : ''}</small>
                        </td>
                        <td><span class="badge ${typeBadge} rounded-pill px-2">${typeName}</span></td>
                        <td>${statusBadge}</td>
                        <td class="small text-muted">${date}</td>
                        ${actionBtns}
                    </tr>
                `;
            }).join('');
        }

        window.showFormModal = function() {
            document.getElementById('announcementForm').reset();
            document.getElementById('inputId').value = '';
            document.getElementById('modalTitle').textContent = 'Tambah Pengumuman';
            document.getElementById('inputDate').valueAsDate = new Date();
            window.clearSelectedImage();
            if(window.formModal) window.formModal.show();
        }

        window.editItem = async function(id) {
            try {
                const res = await API.get(`/announcements/${id}`);
                if (res.success) {
                    const item = res.data;
                    document.getElementById('inputId').value = item.id;
                    document.getElementById('modalTitle').textContent = 'Edit Pengumuman';
                    document.getElementById('inputTitle').value = item.title;
                    document.getElementById('inputType').value = item.type || 'umum';
                    document.getElementById('inputContent').value = item.content;
                    document.getElementById('inputPin').checked = Boolean(item.is_pinned);
                    
                    if (item.published_at) {
                        document.getElementById('inputDate').value = item.published_at.split('T')[0];
                    }

                    window.clearSelectedImage();

                    if (item.image) {
                        const apiBase = API_URL.replace('/api', '');
                        document.getElementById('imagePreview').src = `${apiBase}/uploads/${item.image}`;
                        document.getElementById('imagePreviewWrapper').classList.remove('d-none');
                    }

                    if(window.formModal) window.formModal.show();
                }
            } catch (err) {
                Swal.fire('Gagal', 'Gagal memuat rincian pengumuman', 'error');
            }
        }

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmitForm');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Menyimpan...';
            
            const id = document.getElementById('inputId').value;
            const formData = new FormData();
            formData.append('title', document.getElementById('inputTitle').value);
            formData.append('content', document.getElementById('inputContent').value);
            formData.append('type', document.getElementById('inputType').value);
            formData.append('is_pinned', document.getElementById('inputPin').checked);
            formData.append('published_at', document.getElementById('inputDate').value);

            if (window.selectedImageFile) {
                formData.append('image', window.selectedImageFile);
            }

            try {
                if (id) {
                    await API.put(`/announcements/admin/${id}`, formData, true);
                    Swal.fire('Sukses', 'Pengumuman berhasil diperbarui', 'success');
                } else {
                    await API.post('/announcements/admin', formData, true);
                    Swal.fire('Sukses', 'Pengumuman dan foto berhasil ditambahkan', 'success');
                }
                if(window.formModal) window.formModal.hide();
                window.fetchData();
            } catch (err) {
                Swal.fire('Gagal', err.message || 'Terjadi kesalahan saat menyimpan', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Simpan';
            }
        }

        window.togglePin = async function(id) {
            try {
                await API.patch(`/announcements/admin/${id}/pin`);
                window.fetchData();
            } catch (err) {
                Swal.fire('Gagal', 'Gagal update status pin', 'error');
            }
        }

        window.toggleActive = async function(id) {
            try {
                await API.patch(`/announcements/admin/${id}/toggle`);
                window.fetchData();
            } catch (err) {
                Swal.fire('Gagal', 'Gagal update status aktif', 'error');
            }
        }

        window.deleteItem = async function(id) {
            const res = await Swal.fire({
                title: 'Hapus Pengumuman?',
                text: 'Data tidak dapat dikembalikan!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Ya, Hapus'
            });

            if (res.isConfirmed) {
                try {
                    await API.delete(`/announcements/admin/${id}`);
                    window.fetchData();
                } catch(err) {
                    Swal.fire('Gagal', 'Gagal menghapus pengumuman', 'error');
                }
            }
        }

        window.renderPagination = function(pageInfo) {
            document.getElementById('pageInfo').textContent = `Menampilkan ${pageInfo.total} data (Hal ${pageInfo.page}/${pageInfo.totalPages})`;
            const ul = document.getElementById('paginationControls');
            let html = '';
            
            if (pageInfo.totalPages <= 1) {
                ul.innerHTML = ''; return;
            }

            html += `<li class="page-item ${pageInfo.page === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="window.changePage(${pageInfo.page - 1}); return false;">Prev</a>
            </li>`;
            
            for (let i = 1; i <= pageInfo.totalPages; i++) {
                if (i === 1 || i === pageInfo.totalPages || (i >= pageInfo.page - 1 && i <= pageInfo.page + 1)) {
                    html += `<li class="page-item ${i === pageInfo.page ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="window.changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === pageInfo.page - 2 || i === pageInfo.page + 2) {
                    html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
                }
            }
            
            html += `<li class="page-item ${pageInfo.page === pageInfo.totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="window.changePage(${pageInfo.page + 1}); return false;">Next</a>
            </li>`;
            
            ul.innerHTML = html;
        }

        window.changePage = function(page) {
            window.currentPage = page;
            window.fetchData();
        }
    document.addEventListener('DOMContentLoaded', () => window.initPage(false));
    </script>
</body>
</html>
