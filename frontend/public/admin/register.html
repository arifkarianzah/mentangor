<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Petugas - Posyandu RW 02 Mentangor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1596423735880-5c6be220f836?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(26,92,56,0.95) 0%, rgba(15,23,42,0.95) 100%);
            z-index: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 1);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            z-index: 1;
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    
    <div class="container position-relative z-1">
        <div class="login-card mx-auto d-flex flex-column flex-md-row">
            <!-- Left Branding -->
            <div class="col-md-5 bg-primary-green text-white p-5 d-flex flex-column justify-content-center text-center text-md-start">
                <i class="fa-solid fa-leaf text-accent-orange mb-4" style="font-size: 4rem;"></i>
                <h2 class="fw-medium mb-3">Posyandu RW 02 Mentangor</h2>
                <p class="opacity-75 mb-0">Sistem Informasi Pengelolaan Laporan keluhan kesehatan & Pengumuman Desa.</p>
                <div class="mt-auto pt-5 d-none d-md-block">
                    <a href="/index.html" class="text-white-50 text-decoration-none"><i class="fa-solid fa-arrow-left me-2"></i> Kembali ke Beranda Publik</a>
                </div>
            </div>
            
            <!-- Right Form -->
            <div class="col-md-7 p-4 p-md-5">
                <div class="text-center text-md-start mb-4">
                    <h3 class="fw-medium text-dark">Daftar Petugas Baru</h3>
                    <p class="text-muted">Buat akun untuk mengelola laporan warga.</p>
                </div>
                
                <form id="registerForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-medium text-dark">Nama Lengkap</label>
                            <input type="text" class="form-control bg-light" id="name" required placeholder="Budi Santoso">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-medium text-dark">Nomor HP (Opsional)</label>
                            <input type="text" class="form-control bg-light" id="phone" placeholder="0812...">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-medium text-dark">Alamat Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0 bg-light" id="email" required placeholder="email@contoh.com">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-medium text-dark">Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0 ps-0 bg-light" id="password" required minlength="6" placeholder="Minimal 6 karakter">
                            <button class="input-group-text bg-light border-start-0" type="button" id="btnTogglePass"><i class="fa-regular fa-eye-slash text-muted"></i></button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-green btn-lg w-100 rounded-pill fw-medium shadow-sm mb-3" id="btnRegister">
                        Daftar Sekarang
                    </button>
                    
                    <div class="text-center">
                        <span class="text-muted small">Sudah punya akun? </span>
                        <a href="login.html" class="text-accent-orange text-decoration-none small fw-medium">Masuk di sini</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in
            if (Auth.isAuthenticated()) {
                window.location.href = 'dashboard.html';
            }

            // Toggle password
            const btnToggle = document.getElementById('btnTogglePass');
            const inputPass = document.getElementById('password');
            btnToggle.addEventListener('click', () => {
                if (inputPass.type === 'password') {
                    inputPass.type = 'text';
                    btnToggle.innerHTML = '<i class="fa-regular fa-eye text-primary-green"></i>';
                } else {
                    inputPass.type = 'password';
                    btnToggle.innerHTML = '<i class="fa-regular fa-eye-slash text-muted"></i>';
                }
            });

            // Handle Submit
            const form = document.getElementById('registerForm');
            const btnRegister = document.getElementById('btnRegister');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const name = document.getElementById('name').value;
                const phone = document.getElementById('phone').value;
                const email = document.getElementById('email').value;
                const password = inputPass.value;

                btnRegister.disabled = true;
                btnRegister.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Memproses...';

                try {
                    await Auth.register(name, email, password, phone);
                    Swal.fire({
                        title: 'Registrasi Berhasil!',
                        text: 'Silakan masuk menggunakan akun baru Anda.',
                        icon: 'success',
                        confirmButtonColor: '#1a5c38'
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } catch (err) {
                    Swal.fire({
                        title: 'Registrasi Gagal',
                        text: err.message || 'Terjadi kesalahan, mungkin email sudah digunakan',
                        icon: 'error',
                        confirmButtonColor: '#1a5c38'
                    });
                } finally {
                    btnRegister.disabled = false;
                    btnRegister.innerHTML = 'Daftar Sekarang';
                }
            });
        });
    </script>
</body>
</html>
