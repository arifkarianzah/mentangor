<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Laporan - Posyandu RW 02 Mentangor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../assets/css/style.css?v=4">
    <link rel="stylesheet" href="../assets/css/admin.css?v=10">
</head>
<body class="admin-body">

    <div class="wrapper">
        <!-- Sidebar (loaded dynamically) -->
        <div id="sidebar-container"></div>

        <!-- Page Content -->
        <div id="content">
            <!-- Navbar (loaded dynamically) -->
            <div id="navbar-container"></div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
                    <div class="page-header">
                        <h4>Kelola Laporan</h4>
                        <p>Verifikasi, proses, dan perbarui status laporan warga.</p>
                    </div>
                    
                    <form id="filterForm" class="d-flex gap-2">
                        <select class="form-select w-auto bg-white border-0 shadow-sm" id="statusFilter">
                            <option value="">Semua Status</option>
                            <option value="menunggu">Menunggu Verifikasi</option>
                            <option value="diverifikasi">Telah Diverifikasi</option>
                            <option value="diproses">Sedang Diproses</option>
                            <option value="selesai">Selesai</option>
                            <option value="ditolak">Ditolak</option>
                        </select>
                        <div class="input-group border-0 shadow-sm rounded bg-white">
                            <input type="text" class="form-control border-0 bg-transparent" id="searchInput" placeholder="Cari nomor/lokasi...">
                            <button class="btn btn-primary-green" type="submit"><i class="fa-solid fa-search"></i></button>
                        </div>
                    </form>
                </div>

                <div class="admin-card p-0">
                    <div class="table-responsive p-3">
                        <table class="table table-custom mb-0">
                            <thead>
                                <tr>
                                    <th class="ps-3">ID Laporan</th>
                                    <th>Pelapor</th>
                                    <th>Alamat/Lokasi</th>
                                    <th>Status</th>
                                    <th>Tanggal</th>
                                    <th class="text-end pe-3">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary-green"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-3 px-2">
                    <span class="text-muted small" id="pageInfo">Menampilkan 0 data</span>
                    <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js?v=12"></script>
    <script>
        window.currentPage = 1;

        window.initPage = async (isSPA = false) => {
            if (!Auth.isAuthenticated()) { window.location.href = 'login.html'; return; }
            if (!isSPA) await Components.load('reports');

            const urlParams = new URLSearchParams(window.location.search);
            const statusParam = urlParams.get('status');
            const statusFilter = document.getElementById('statusFilter');
            if (statusFilter && statusParam) statusFilter.value = statusParam;

            window.fetchData();

            const filterForm = document.getElementById('filterForm');
            if (filterForm) {
                filterForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    window.currentPage = 1;
                    window.fetchData();
                });
            }

            if (statusFilter) {
                statusFilter.addEventListener('change', () => {
                    window.currentPage = 1;
                    window.fetchData();
                });
            }
        };

        window.fetchData = async function() {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary-green" role="status"></div></td></tr>`;
            
            const keyword = document.getElementById('searchInput') ? document.getElementById('searchInput').value : '';
            const status = document.getElementById('statusFilter') ? document.getElementById('statusFilter').value : '';
            
            try {
                const res = await API.get(`/reports?page=${window.currentPage}&limit=10&search=${keyword}&status=${status}`);
                if (res.success) {
                    window.renderTable(res.data);
                    window.renderPagination(res.pagination);
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Gagal memuat data laporan</td></tr>`;
            }
        };

        window.renderTable = function(data) {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada laporan ditemukan</td></tr>`;
                return;
            }
            
            const statusLabels = {
                'menunggu': '<span class="badge-status badge-menunggu">Menunggu</span>',
                'diverifikasi': '<span class="badge-status badge-diverifikasi">Diverifikasi</span>',
                'diproses': '<span class="badge-status badge-diproses">Diproses</span>',
                'selesai': '<span class="badge-status badge-selesai">Selesai</span>',
                'ditolak': '<span class="badge-status badge-ditolak">Ditolak</span>'
            };

            tbody.innerHTML = data.map((item, index) => {
                const date = new Date(item.created_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                return `
                    <tr>
                        <td class="text-center">${(window.currentPage - 1) * 10 + index + 1}</td>
                        <td class="font-monospace text-muted small">${item.report_number}</td>
                        <td>
                            <div class="fw-medium text-dark">${item.title}</div>
                            <div class="small text-muted text-truncate" style="max-width:200px;">${item.address}</div>
                        </td>
                        <td>${date}</td>
                        <td>${statusLabels[item.status] || item.status}</td>
                        <td>
                            <a href="report-detail.html?id=${item.id}" class="btn btn-sm btn-outline-primary-green me-1" title="Lihat Detail"><i class="fa-solid fa-eye"></i></a>
                            <button class="btn btn-sm btn-outline-danger" title="Hapus" onclick="window.confirmDelete(${item.id})"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        };

        window.confirmDelete = function(id) {
            Swal.fire({
                title: 'Hapus Laporan?',
                text: "Data yang dihapus tidak dapat dikembalikan!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const res = await API.delete(`/reports/${id}`);
                        if (res.success) {
                            Swal.fire('Terhapus!', 'Laporan berhasil dihapus.', 'success');
                            window.fetchData();
                        }
                    } catch(err) {
                        Swal.fire('Gagal!', err.message || 'Gagal menghapus data', 'error');
                    }
                }
            });
        };

        window.renderPagination = function(pageInfo) {
            const ul = document.getElementById('pagination');
            if (!ul) return;
            if (pageInfo.totalPages <= 1) { ul.innerHTML = ''; return; }
            
            let html = `<li class="page-item ${window.currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="window.changePage(${window.currentPage - 1}); return false;">Prev</a>
            </li>`;
            
            for (let i = 1; i <= pageInfo.totalPages; i++) {
                if (i === 1 || i === pageInfo.totalPages || (i >= window.currentPage - 1 && i <= window.currentPage + 1)) {
                    html += `<li class="page-item ${i === window.currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="window.changePage(${i}); return false;">${i}</a>
                    </li>`;
                } else if (i === window.currentPage - 2 || i === window.currentPage + 2) {
                    html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`;
                }
            }
            
            html += `<li class="page-item ${window.currentPage === pageInfo.totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="window.changePage(${window.currentPage + 1}); return false;">Next</a>
            </li>`;
            
            ul.innerHTML = html;
        };

        window.changePage = function(page) {
            window.currentPage = page;
            window.fetchData();
        };

        document.addEventListener('DOMContentLoaded', () => window.initPage(false));
    </script>
</body>
</html>
